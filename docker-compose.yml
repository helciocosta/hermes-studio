services:
  hermes-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-web-ui-local:latest
    container_name: hermes-webui
    ports:
      - 6060:6060
      - 8651:8651
      - 56121:56121
    env_file:
      - .env.local
    volumes:
      - ./hermes_data:/home/agent/.hermes
      - ./hermes_data/hermes-web-ui:/home/agent/.hermes-web-ui
    environment:
      - PORT=6060
      - HERMES_HOME=/home/agent/.hermes
      - HERMES_BIN=/opt/hermes/.venv/bin/hermes
      - HERMES_WEB_UI_MANAGED_GATEWAY=1
      - HERMES_WEB_UI_AUTH_JWT_EXPIRES_IN=${HERMES_WEB_UI_AUTH_JWT_EXPIRES_IN:-30d}
      - HERMES_WEB_UI_XAI_CALLBACK_BIND_HOST=0.0.0.0
      - PATH=/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - HERMES_ALLOW_ROOT_GATEWAY=1
      - AUTH_TOKEN=
      - AUTH_JWT_SECRET=
      - PROFILE=default
      - LOG_LEVEL=info
      - HERMES_WEB_UI_DISABLE_GATEWAY_AUTOSTART=0
      - HERMES_WEB_UI_DISABLE_MCP_AUTOINJECT=0
      - HERMES_WEB_UI_DISABLE_SKILL_INJECTION=0
    restart: unless-stopped
    stdin_open: true
    tty: true
